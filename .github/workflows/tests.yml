name: tests

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r national/requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  # Fetch every live feed without writing anything, to confirm each one
  # is reachable from GitHub and parses. Only runs on branches, not main.
  live-feeds:
    if: github.event_name == 'push'
    # A feed that is down should show as a failed job without failing the
    # whole run, so it does not send a failure email.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m collectors.run power --dry-run
      - run: python -m collectors.run water --dry-run
      - run: python -m collectors.households --dry-run
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - run: python -m collectors.swbno_releases --dry-run
      - run: pip install -q -r national/requirements.txt
      - run: python -m national.reliability --inspect
