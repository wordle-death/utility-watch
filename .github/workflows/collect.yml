name: collect

on:
  schedule:
    - cron: "3,18,33,48 * * * *"  # power, every 15 minutes (GitHub may delay runs)
    - cron: "7 * * * *"     # water, hourly
  workflow_dispatch:
    inputs:
      group:
        description: "power or water"
        required: true
        default: power

permissions:
  contents: write

# Power and water runs both commit to main, so run one at a time.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick group
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            echo "group=water" >> "$GITHUB_OUTPUT"
          else
            echo "group=power" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect
        run: python -m collectors.run ${{ steps.pick.outputs.group }}
      - name: Commit data
        run: |
          git config user.name "utility-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: ${{ steps.pick.outputs.group }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep 5
          done
          exit 1
