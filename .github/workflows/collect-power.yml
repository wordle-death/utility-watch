name: collect-power

on:
  schedule:
    - cron: "4,19,34,49 * * * *"  # every 15 minutes; GitHub may delay or skip scheduled runs
  workflow_dispatch:
    inputs:
      hours:
        description: "Keep collecting every 15 minutes for this many hours (0 = collect once). A stopgap for when scheduled runs are not firing."
        default: "0"

permissions:
  contents: write

# One power run at a time. Power and water write different files, so their
# runs never conflict with each other.
concurrency:
  group: collect-power
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          HOURS: ${{ inputs.hours || '0' }}
        run: |
          case "$HOURS" in ''|*[!0-9]*) HOURS=0 ;; esac
          [ "$HOURS" -gt 5 ] && HOURS=5
          end=$((SECONDS + HOURS * 3600))
          status=0
          while :; do
            python -m collectors.run power || status=$?
            scripts/commit_data.sh power || status=$?
            [ "$SECONDS" -ge "$end" ] && break
            sleep 900
          done
          exit $status
      # Fail the run, which sends one email, only when a source has just gone
      # 6 hours without a successful collection, or a push failed.
      - name: Report problem
        if: steps.collect.outcome == 'failure'
        run: exit 1
