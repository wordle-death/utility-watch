name: national

# Federal reliability data changes about once a year; check monthly.
on:
  schedule:
    - cron: "23 9 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: national
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r national/requirements.txt
      - run: python -m national.reliability
      - name: Commit data
        run: scripts/commit_data.sh "national reliability"
