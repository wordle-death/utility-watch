<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0;width:1200px;height:630px;background:#f6f7f8;font-family:"Public Sans",system-ui,sans-serif;color:#10161d;display:flex}
.card{margin:56px 64px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:24px;letter-spacing:.09em;text-transform:uppercase;color:#4a535d}
h1{font-size:66px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:18px 0 0;max-width:960px}
.row{display:flex;gap:28px}
.stat{background:#fcfcfb;border:1px solid #dfe2e5;border-radius:10px;padding:20px 24px;flex:1}
.num{font-size:44px;font-weight:700;letter-spacing:-.02em}
.lab{font-size:21px;color:#4a535d;margin-top:4px}
.bar{height:10px;background:#0f5f8c;border-radius:5px;width:180px}
</style></head><body><div class="card">
<div><div class="bar"></div><div class="eyebrow" style="margin-top:28px">Utility Watch</div>
<h1>How often the power and safe water go out, and for how long</h1></div>
<div class="row">
<div class="stat"><div class="num">94</div><div class="lab">New Orleans boil-water advisories on record</div></div>
<div class="stat"><div class="num">971</div><div class="lab">U.S. utility outage reports compared</div></div>
<div class="stat"><div class="num">15 min</div><div class="lab">how often live outages are saved</div></div>
</div></div></body></html>
